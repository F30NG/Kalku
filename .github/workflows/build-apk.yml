name: Build Kalku APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Periksa file proyek
        run: |
          echo "=== Isi folder utama ==="
          ls -la
          echo "=== Cari file konfigurasi Gradle ==="
          find . -maxdepth 3 \( -name "settings.gradle" -o -name "build.gradle" \) -print

      - name: Bangun APK
        run: gradle -p . assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalku-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
